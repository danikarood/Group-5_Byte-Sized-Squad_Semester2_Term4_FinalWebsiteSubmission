<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Details</title> 
  <link rel="stylesheet" href="../css/main.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="position:sticky;top:0;z-index:1050">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="Home page.html">Byte-Sized Squad</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="Home page.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="Movie Library page.html">Library</a></li>
          <li class="nav-item"><a class="nav-link" href="Movie watchlist page.html">Watchlist</a></li>
        </ul>
        <form id="navSearchForm" class="d-flex" role="search">
          <input id="navSearchInput" class="form-control me-2" type="search" placeholder="Search movies…">
          <button class="btn btn-outline-light" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container">
    <div id="error" class="alert alert-danger d-none mt-3"></div>

    <div class="header">
      <h1 id="title">Loading…</h1>
    </div>

    <div class="movie-details">
      <div class="poster">
        <img id="poster" class="movie-poster" src="../Assets/images/placeholder.jpg" alt="Movie poster">
        <button id="addToWatchlist" class="btn btn-warning w-100 mt-3">Add to Watchlist</button>
      </div>

      <div class="info">
        <h2>Synopsis</h2>
        <p id="overview">—</p>

        <h2>Cast</h2>
        <p id="cast">—</p>

        <h2>Director</h2>
        <p id="director">—</p>

        <p class="rating">⭐ <span id="rating">—</span></p>
      </div>
    </div>

    <div class="trailer">
      <h2>Watch the Trailer</h2>
      <div id="trailer"></div> 
    </div>

    <div class="footer">
      <p>&copy; 2025 Byte-Sized Squad. All rights reserved.</p>
    </div>
  </div>

  <script src="https://kit.fontawesome.com/11eed083ad.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Js/script.js"></script>       
  <script src="../Js/movieDetails.js"></script>   
</body>
</html>
