<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Watchlist | Byte-Sized Squad</title>

  <!-- Bootstrap + your site styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />

  <style>
    /* Full-width section, centered white shell */
    .watchlist-shell{
      width:100%;
      max-width:1400px;         /* cap so it doesn’t get too wide */
      margin:0 auto;            /* center the panel */
      background:#ffffff;
      border-radius:24px;
      padding:32px 40px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }

    /* Card sizing to match Home cards */
    #watchlistGrid .movie-card{ width:100%; height:100%; display:flex; flex-direction:column; }
    #watchlistGrid .movie-poster{ width:100%; height:420px; object-fit:cover; }
    #watchlistGrid .movie-info{ padding:1.25rem; }

    /* Nice empty state */
    .empty-box{
      background: rgba(255,255,255,0.05);
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      color:#e9f0ff;
    }
  </style>
</head>
<body class="bg-dark text-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="Home page.html">Byte-Sized Squad</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="navMenu" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="Home page.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="Movie Library page.html">Library</a></li>
          <li class="nav-item"><a class="nav-link active" href="Movie watchlist page.html">Watchlist</a></li>
        </ul>
        <!-- keep these IDs; your search JS uses them -->
        <form id="navSearchForm" class="d-flex" role="search">
          <input id="navSearchInput" class="form-control me-2" type="search" placeholder="Search movies…">
          <button class="btn btn-outline-light" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Wider section for the panel -->
  <main class="container-fluid py-5">
    <div class="d-flex align-items-center justify-content-between mb-3 px-3 px-lg-5">
      <h1 class="h3 m-0">Your Watchlist</h1>
      <button id="clearWatchlist" class="btn btn-outline-danger btn-sm">Clear all</button>
    </div>

    <div class="d-flex justify-content-center px-3 px-lg-5">
      <div class="watchlist-shell">
        <div id="emptyMsg" class="empty-box my-3 d-none">
          <h5 class="mb-2">Your watchlist is empty</h5>
          <p class="mb-0">Browse the <a href="Movie Library page.html" class="link-light fw-semibold">Library</a> or the <a href="Home page.html" class="link-light fw-semibold">Home</a> page and tap <span class="badge text-bg-warning">+ Watchlist</span> on any movie.</p>
        </div>

        <!-- Even spacing: 1 / 2 / 4 / 5 across by breakpoint -->
        <div id="watchlistGrid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 row-cols-xxl-5 g-4"></div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 border-top border-secondary">
    <p class="mb-0">&copy; 2025 Byte-Sized Squad. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ===== Watchlist render (cards match Home) ===== */
    const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
    const PLACEHOLDER = '../Assets/images/placeholder.jpg';
    const WL_KEY = 'watchlist';

    function getWatchlist() {
      try { return JSON.parse(localStorage.getItem(WL_KEY)) || []; } catch { return []; }
    }
    function setWatchlist(arr){ localStorage.setItem(WL_KEY, JSON.stringify(arr || [])); }
    function poster(p){ return p ? IMG_BASE + p : PLACEHOLDER; }

    function cardHTML(m){
      const rating = m.vote_average ? Number(m.vote_average).toFixed(1) : 'N/A';
      return `
        <div class="col">
          <div class="movie-card">
            <img class="movie-poster" src="${poster(m.poster_path)}" alt="${m.title}">
            <div class="movie-info">
              <div class="movie-title">${m.title}</div>
              <div class="movie-desc"></div>
              <div class="movie-rating">⭐ ${rating}</div>
              <div class="movie-actions">
                <a href="individual movie page.html?id=${m.id}" class="btn btn-primary w-100">View details</a>
                <button class="btn btn-outline-light w-100 mt-3" data-remove="${m.id}">Remove</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderWatchlist(){
      const list = getWatchlist();
      const grid = document.getElementById('watchlistGrid');
      const empty = document.getElementById('emptyMsg');

      if (!list.length){
        grid.innerHTML = '';
        empty?.classList.remove('d-none');
        return;
      }
      empty?.classList.add('d-none');
      grid.innerHTML = list.map(cardHTML).join('');
    }

    // Remove single item
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove]');
      if (!btn) return;
      const id = Number(btn.getAttribute('data-remove'));
      const next = getWatchlist().filter(m => m.id !== id);
      setWatchlist(next);
      renderWatchlist();
    });

    // Clear all
    document.getElementById('clearWatchlist')?.addEventListener('click', () => {
      if (confirm('Clear your entire watchlist?')){
        setWatchlist([]);
        renderWatchlist();
      }
    });

    document.addEventListener('DOMContentLoaded', renderWatchlist);
  </script>
</body>
</html>
